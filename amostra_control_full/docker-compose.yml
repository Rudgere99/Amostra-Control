services:
  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    environment:
      - PORT=3001
      - DATABASE_FILE=./database.sqlite
      - CORS_ORIGIN=http://localhost:5173

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - backend
